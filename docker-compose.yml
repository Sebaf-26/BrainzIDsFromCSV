version: "3.9"

services:
  brainzids:
    build: .
    container_name: brainzids_lookup
    volumes:
      - ${DATA_PATH}:/app/data
    command: >
      python mbid_lookup.py
      --input /app/data/${INPUT_FILE}
      --output /app/data/${OUTPUT_FILE}
      --app "${APP_NAME}"
      --contact "${APP_CONTACT}"
