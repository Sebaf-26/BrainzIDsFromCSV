<!DOCTYPE html>
<html>
<head>
    <title>BrainzIDs from CSV</title>
    <style>
        body {
            background: #0F172A;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 100px;
        }
        .box {
            border: 2px dashed #888;
            padding: 40px;
            width: 400px;
            margin: auto;
            border-radius: 10px;
        }
        button {
            margin-top: 20px;
            padding: 10px 20px;
            background: #22c55e;
            border: none;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>BrainzIDs from CSV</h1>
    <div class="box">
        <form method="POST" enctype="multipart/form-data">
            <input type="file" name="file" accept=".csv" required>
            <br>
            <button type="submit">Converti</button>
        </form>
    </div>
    <p>Il CSV deve avere una colonna chiamata <b>Artist</b></p>
</body>
</html>
